<style>
:root{--gold:#C9A227;--green:#1F5F4A;--ink:#2E2A24;--fg:#2E2A24;--fg2:rgba(46,42,36,.65);--glass:rgba(255,252,245,.78);--gline:rgba(201,162,39,.45)}

  <h3>Pilih lokasi</h3>

  <div class="msg">Zona waktu koordinat manual mengikuti HP kamu.</div>
</div>
<script>
const DR=Math.PI/180,sin=d=>Math.sin(d*DR),cos=d=>Math.cos(d*DR),tan=d=>Math.tan(d*DR),asin=x=>Math.asin(x)/DR,acos=x=>Math.acos(x)/DR,atan2=(y,x)=>Math.atan2(y,x)/DR,acot=x=>Math.atan(1/x)/DR;
const fix=(a,b)=>{a=a-b*Math.floor(a/b);return a<0?a+b:a};
function julian(y,m,d){if(m<=2){y--;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5;}
function sunPos(jd){const D=jd-2451545,g=fix(357.529+.98560028*D,360),q=fix(280.459+.98564736*D,360),L=fix(q+1.915*sin(g)+.020*sin(2*g),360),e=23.439-.00000036*D,RA=atan2(cos(e)*sin(L),cos(L))/15;return{decl:asin(sin(e)*sin(L)),eqt:q/15-fix(RA,24)};}
function prayTimes(y,m,d,lat,lng){
  const jd=julian(y,m,d)-lng/(15*24),mid=t=>fix(12-sunPos(jd+t).eqt,24);
  const angT=(a,t,ccw)=>{const dec=sunPos(jd+t).decl,T=acos((-sin(a)-sin(dec)*sin(lat))/(cos(dec)*cos(lat)))/15;return mid(t)+(ccw?-T:T);};
  const asrT=(f,t)=>{const dec=sunPos(jd+t).decl;return angT(-acot(f+tan(Math.abs(lat-dec))),t);};
  let t={fajr:5,sunrise:6,dhuha:6.5,dhuhr:12,asr:13,maghrib:18,isha:18};
  for(let i=0;i<2;i++){const p=k=>t[k]/24;t={fajr:angT(18,p('fajr'),true),sunrise:angT(.833,p('sunrise'),true),dhuha:angT(-4.5,p('dhuha'),true),dhuhr:mid(p('dhuhr')),asr:asrT(1,p('asr')),maghrib:angT(.833,p('maghrib')),isha:angT(17,p('isha'))};}
  const base=Date.UTC(y,m-1,d),out={};for(const k in t)out[k]=isNaN(t[k])?null:new Date(Math.round((base+(t[k]-lng/15)*3600e3)/60000)*60000);
  return out;
}

const CITIES=[
 ['Jepang',[['Yokohama (Aoba-ku)',35.5527,139.5370],['Yokohama (Pusat)',35.4437,139.6380],['Tokyo',35.6812,139.7671],['Kawasaki',35.5308,139.7029],['Saitama',35.8617,139.6455],['Chiba',35.6074,140.1065],['Nagoya',35.1815,136.9066],['Osaka',34.6937,135.5023],['Kyoto',35.0116,135.7681],['Kobe',34.6901,135.1955],['Hiroshima',34.3853,132.4553],['Fukuoka',33.5904,130.4017],['Sendai',38.2682,140.8694],['Sapporo',43.0618,141.3545],['Hamamatsu',34.7108,137.7261]],'Asia/Tokyo'],
 ['Indonesia (WIB)',[['Jakarta',-6.2088,106.8456],['Tangerang Selatan (Pamulang)',-6.3428,106.7390],['Bogor',-6.5971,106.8060],['Bekasi',-6.2383,106.9756],['Bandung',-6.9175,107.6191],['Semarang',-6.9667,110.4167],['Yogyakarta',-7.7956,110.3695],['Surabaya',-7.2575,112.7521],['Malang',-7.9666,112.6326],['Medan',3.5952,98.6722],['Palembang',-2.9761,104.7754],['Pekanbaru',0.5071,101.4478],['Padang',-0.9471,100.4172],['Banda Aceh',5.5483,95.3238],['Pontianak',-0.0263,109.3425]],'Asia/Jakarta'],
 ['Indonesia (WITA/WIT)',[['Denpasar',-8.6705,115.2126,'Asia/Makassar'],['Makassar',-5.1477,119.4327,'Asia/Makassar'],['Balikpapan',-1.2379,116.8529,'Asia/Makassar'],['Banjarmasin',-3.3194,114.5908,'Asia/Makassar'],['Manado',1.4748,124.8421,'Asia/Makassar'],['Mataram',-8.5833,116.1167,'Asia/Makassar'],['Ambon',-3.6954,128.1814,'Asia/Jayapura'],['Jayapura',-2.5916,140.6690,'Asia/Jayapura']],null],
 ['Lainnya',[['Makkah',21.4225,39.8262,'Asia/Riyadh'],['Madinah',24.4672,39.6024,'Asia/Riyadh'],['Kuala Lumpur',3.1390,101.6869,'Asia/Kuala_Lumpur'],['Singapura',1.3521,103.8198,'Asia/Singapore'],['Seoul',37.5665,126.9780,'Asia/Seoul']],null]
];

const KEY='jadwal-sholat-loc-v1';
const DEV_TZ=(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'Asia/Tokyo'}catch(e){return'Asia/Tokyo'}})();
const NAMES={fajr:['Subuh','الفجر'],sunrise:['Syuruq','الشروق'],dhuha:['Dhuha','الضحى'],dhuhr:['Dzuhur','الظهر'],asr:['Ashar','العصر'],maghrib:['Maghrib','المغرب'],isha:['Isya','العشاء']};
const ORDER=['fajr','sunrise','dhuha','dhuhr','asr','maghrib','isha'],PRAY=['fajr','dhuhr','asr','maghrib','isha'];
let loc=null;try{loc=JSON.parse(localStorage.getItem(KEY))}catch(e){}
const FIRST_RUN=!loc||typeof loc.lat!=='number';
if(FIRST_RUN)loc={name:'Tokyo',lat:35.6812,lng:139.7671,tz:'Asia/Tokyo'};
const saveLoc=()=>{try{localStorage.setItem(KEY,JSON.stringify(loc))}catch(e){}};
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
function ymd(date,tz){const p={};new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'numeric',day:'numeric'}).formatToParts(date).forEach(x=>p[x.type]=+x.value);return[p.year,p.month,p.day];}
const hm=(d,tz)=>d?d.toLocaleTimeString('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',hour12:false}):'—';
function dayTimes(off){const [y,m,d]=ymd(new Date(Date.now()+off*864e5),loc.tz);return prayTimes(y,m,d,loc.lat,loc.lng);}
let cache={key:''};
function getTimes(){const k=ymd(new Date(),loc.tz).join('-')+loc.lat+loc.lng;if(cache.key!==k)cache={key:k,today:dayTimes(0),tom:dayTimes(1),yest:dayTimes(-1)};return cache;}

/* ===== sky ===== */
const C={night:['#0B1730','#1C2C4F'],predawn:['#1D2B55','#4A4E7A'],dawn:['#4E5D94','#F0B48A'],morning:['#8CC3E6','#F7E6C4'],day:['#5FA8DC','#D6ECF7'],afternoon:['#7FB2D6','#F2DCAE'],golden:['#D9925A','#F5D29A'],sunset:['#5B4A78','#E9825E'],twilight:['#1F2A52','#5A4E7A']};
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),mix=(a,b,t)=>{const x=hex(a),y=hex(b);return'rgb('+x.map((v,i)=>Math.round(v+(y[i]-v)*t)).join(',')+')';},lum=c=>{const [r,g,b]=c.match(/\d+/g).map(Number);return(.299*r+.587*g+.114*b)/255;};
const STARRY={night:1,predawn:.7,dawn:.15,twilight:.6,sunset:.1};
function skyAt(now,T){
  const M=6e4,k=[[+T.fajr-30*M,'night'],[+T.fajr,'predawn'],[+T.sunrise-10*M,'dawn'],[+T.sunrise+60*M,'morning'],[+T.dhuhr,'day'],[+T.asr,'afternoon'],[+T.maghrib-25*M,'golden'],[+T.maghrib,'sunset'],[+T.isha,'twilight'],[+T.isha+40*M,'night']];
  let a=k[0],b=k[0],t=0;
  if(now>=k[k.length-1][0])a=b=k[k.length-1];else if(now>k[0][0])for(let i=0;i<k.length-1;i++)if(now>=k[i][0]&&now<k[i+1][0]){a=k[i];b=k[i+1];t=(now-a[0])/(b[0]-a[0]);break;}
  const top=mix(C[a[1]][0],C[b[1]][0],t),bot=mix(C[a[1]][1],C[b[1]][1],t),st=(STARRY[a[1]]||0)*(1-t)+(STARRY[b[1]]||0)*t;
  return{top,bot,stars:st,dark:lum(top)*.75+lum(bot)*.25<.55};
}
let starsDrawn=0;
function drawStars(){const c=$('stars'),w=innerWidth,h=innerHeight;if(starsDrawn===w*h)return;starsDrawn=w*h;c.width=w;c.height=h;const x=c.getContext('2d');let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
  for(let i=0;i<90;i++){const px=r()*w,py=r()*h*.75,rad=r()*1.1+.3;x.globalAlpha=.35+r()*.6;x.fillStyle='#FFF7E0';x.beginPath();x.arc(px,py,rad,0,7);x.fill();}}
function drawOrb(now,T,dark){const o=$('orb');
  if(T.sunrise&&T.maghrib&&now>=+T.sunrise&&now<+T.maghrib){const f=(now-T.sunrise)/(T.maghrib-T.sunrise),col=f>.8||f<.1?'#F4A259':'#F6C445';
    o.innerHTML=`<circle cx="15" cy="15" r="6.5" fill="${col}"/><g stroke="${col}" stroke-width="1.6" stroke-linecap="round">${[0,45,90,135,180,225,270,315].map(a=>`<line x1="15" y1="3.5" x2="15" y2="6" transform="rotate(${a} 15 15)"/>`).join('')}</g>`;}
  else o.innerHTML='<path d="M19 5a10 10 0 1 0 6 17A8 8 0 0 1 19 5z" fill="#F3E3B3"/><path d="M24.5 6.5l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6z" fill="#F3E3B3"/>';}

/* ===== UI ===== */
function renderList(){const {today}=getTimes();
  $('list').innerHTML=ORDER.map(k=>`<div class="row ${k==='sunrise'||k==='dhuha'?'minor':''}" id="r-${k}"><span class="nm">${NAMES[k][0]}<small></small></span><span class="ar">${NAMES[k][1]}</span><span class="tm">${hm(today[k],loc.tz)}</span></div>`).join('');}
function tick(){
  const {today,tom,yest,key}=getTimes(),now=Date.now(),tz=loc.tz;
  if($('list').dataset.k!==key){renderList();$('list').dataset.k=key;}
  let next=PRAY.find(k=>today[k]&&today[k]>now),nextT=next?today[next]:tom.fajr,tomorrow=!next;if(!next)next='fajr';
  const passed=PRAY.filter(k=>today[k]&&today[k]<=now),cur=passed.length?passed[passed.length-1]:'isha';
  const afterSunrise=cur==='fajr'&&today.sunrise&&now>=today.sunrise;
  const s=Math.max(0,Math.floor((nextT-now)/1000));
  $('cd').textContent=`${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`;
  $('lbl').textContent=`Menuju ${NAMES[next][0]}${tomorrow?' (besok)':''}`;$('lblAr').textContent=NAMES[next][1];
  $('at').textContent=`pukul ${hm(nextT,tz)}`;
  const inDhuha=afterSunrise&&today.dhuha&&now>=today.dhuha;
  $('now').textContent=afterSunrise?(inDhuha?`Sekarang waktu Dhuha · sampai ${hm(new Date(+today.dhuhr-5*6e4),tz)}`:`Matahari terbit · Dhuha mulai ${hm(today.dhuha,tz)}`):`Sekarang waktu ${NAMES[cur][0]}`;
  ORDER.forEach(k=>{const el=$('r-'+k);if(!el)return;const isCur=k===cur&&!afterSunrise&&passed.length>0;
    el.classList.toggle('past',!!today[k]&&today[k]<=now&&!isCur);el.classList.toggle('next',k===next&&!tomorrow);
    el.querySelector('small').textContent=(isCur||(k==='dhuha'&&inDhuha))?'● berlangsung':'';if(k==='dhuha'&&inDhuha)el.classList.remove('past');});
  if(tomorrow)$('r-fajr').classList.remove('past');
  // sky
  const sk=skyAt(now,today);$('themeColor').setAttribute('content',sk.top);$('sky').style.background=`linear-gradient(180deg,${sk.top} 0%,${sk.bot} 100%)`;
  drawStars();$('stars').style.opacity=sk.stars.toFixed(2);document.body.classList.toggle('dark',sk.dark);drawOrb(now,today,sk.dark);
  // header
  $('locName').textContent=loc.name;const d=new Date();
  let dt=d.toLocaleDateString('id-ID',{timeZone:tz,weekday:'long',day:'numeric',month:'long',year:'numeric'});if(tz!==DEV_TZ)dt+=` · waktu ${tz.split('/')[1].replace('_',' ')} ${hm(d,tz)}`;
  $('date').textContent=dt;
  try{$('hijri').textContent=new Intl.DateTimeFormat('id-ID-u-ca-islamic-umalqura',{timeZone:tz,day:'numeric',month:'long',year:'numeric'}).format(d);}catch(e){}
}
/* ===== location ===== */
function openSheet(){$('sheet').style.display='block';$('sheetbg').style.display='block';$('gpsMsg').textContent='';$('gpsMsg').className='msg';$('search').value='';renderCities('');}
function closeSheet(){$('sheet').style.display='none';$('sheetbg').style.display='none';}
function setLoc(l){loc=l;saveLoc();cache.key='';closeSheet();tick();}
function renderCities(q){q=q.trim().toLowerCase();
  $('cities').innerHTML=CITIES.map(([g,list,tz])=>{const it=list.filter(c=>!q||c[0].toLowerCase().includes(q));if(!it.length)return'';
    return`<div class="grp">${g}</div>`+it.map(c=>`<button class="city" data-c='${JSON.stringify([c[0],c[1],c[2],c[3]||tz])}'>${c[0]}<small>${(c[3]||tz).split('/')[1].replace('_',' ')}</small></button>`).join('');}).join('')||'<div class="msg">Kota tidak ditemukan. Pakai koordinat manual di bawah.</div>';}
$('locBtn').onclick=openSheet;$('sheetbg').onclick=closeSheet;$('search').oninput=e=>renderCities(e.target.value);
$('cities').onclick=e=>{const b=e.target.closest('.city');if(!b)return;const [name,lat,lng,tz]=JSON.parse(b.dataset.c);setLoc({name,lat,lng,tz});};
$('mgo').onclick=()=>{const lat=parseFloat($('mlat').value.replace(',','.')),lng=parseFloat($('mlng').value.replace(',','.'));
  if(!(Math.abs(lat)<=90&&Math.abs(lng)<=180)){$('gpsMsg').className='msg err';$('gpsMsg').textContent='Koordinat tidak valid.';$('sheet').scrollTop=0;return;}
  setLoc({name:`${lat.toFixed(3)}, ${lng.toFixed(3)}`,lat,lng,tz:DEV_TZ});};
function locate(ok,fail,maxAge){if(!navigator.geolocation)return fail&&fail();
  try{navigator.geolocation.getCurrentPosition(p=>{const l={name:'Lokasi saat ini',lat:+p.coords.latitude.toFixed(4),lng:+p.coords.longitude.toFixed(4),tz:DEV_TZ,gps:true};ok(l);},()=>fail&&fail(),{timeout:12000,maximumAge:maxAge||600000,enableHighAccuracy:false});}catch(e){fail&&fail();}}
$('gpsBtn').onclick=()=>{const m=$('gpsMsg');m.className='msg';m.textContent='Mencari lokasi…';
  locate(setLoc,()=>{m.className='msg err';m.textContent='Lokasi tidak bisa diakses. Pastikan izin lokasi untuk aplikasi/browser ini aktif, atau pilih kota di bawah.';});};
// pertama kali dibuka: coba GPS. Kalau sebelumnya pakai GPS: perbarui diam-diam (berguna saat bepergian)
if(FIRST_RUN)locate(l=>{loc=l;saveLoc();cache.key='';tick();});
else if(loc.gps)locate(l=>{if(Math.abs(l.lat-loc.lat)>.02||Math.abs(l.lng-loc.lng)>.02||l.tz!==loc.tz){loc=l;saveLoc();cache.key='';tick();}},null,1800000);
addEventListener('resize',()=>{starsDrawn=0;drawStars();});
tick();setInterval(tick,1000);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
</script>
</body>
